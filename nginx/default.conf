# Servidor Web de la aplicación DPL (curso DPL, UT4)
# Proxy inverso hacia el
# servidor de aplicaciones Django (servicio "django" de la red de Compose).
# El puerto interno 8000 de Django NO se publica al anfitrión: esta es la
# única puerta de entrada.

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}